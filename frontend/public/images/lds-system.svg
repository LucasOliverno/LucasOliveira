<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with dark engineering slate aesthetic -->
  <rect width="800" height="450" fill="#090D16"/>

  <defs>
    <pattern id="grid-lds" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow-lds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#grid-lds)"/>

  <!-- Top Title Banner -->
  <text x="50" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#38BDF8" letter-spacing="1.5">LDS TELEMETRY — PIPELINE LEAK DETECTION</text>
  <rect x="620" y="30" width="130" height="24" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="685" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#34D399" text-anchor="middle">STATUS: MONITORANDO</text>

  <!-- PIPELINE VECTOR (Main Center Pipe) -->
  <g transform="translate(50, 110)">
    <!-- Outer Pipeline Tube -->
    <rect x="0" y="30" width="700" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <!-- Fluid flow line inside -->
    <rect x="10" y="38" width="680" height="8" rx="4" fill="url(#cyan-glow)"/>
    
    <!-- Sensor Nodes on Pipe -->
    <circle cx="120" cy="42" r="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="340" cy="42" r="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Leak Alert Location Node -->
    <circle cx="510" cy="42" r="12" fill="#EF4444" fill-opacity="0.3" filter="url(#glow-lds)"/>
    <circle cx="510" cy="42" r="7" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>

    <!-- Labels for sensors -->
    <text x="120" y="75" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="middle">S-01 (PT-101)</text>
    <text x="340" y="75" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="middle">S-02 (PT-102)</text>
    <text x="510" y="75" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold" fill="#FCA5A5" text-anchor="middle">⚠️ VAZAMENTO DETECTADO (KM 42.8)</text>
  </g>

  <!-- LOWER PANEL: Real-time Hydraulics Chart Card -->
  <g transform="translate(50, 220)">
    <rect width="700" height="180" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Chart Grid Lines -->
    <line x1="40" y1="40" x2="660" y2="40" stroke="#1E293B" stroke-dasharray="4 4"/>
    <line x1="40" y1="80" x2="660" y2="80" stroke="#1E293B" stroke-dasharray="4 4"/>
    <line x1="40" y1="120" x2="660" y2="120" stroke="#1E293B" stroke-dasharray="4 4"/>

    <!-- Normal Pressure Line -->
    <path d="M 40 60 Q 200 58 350 62 T 480 60 L 500 110 L 660 115" fill="none" stroke="#EF4444" stroke-width="2.5" filter="url(#glow-lds)"/>
    
    <!-- Flow Rate Line (Green) -->
    <path d="M 40 100 Q 200 98 350 102 T 480 100 L 500 135 L 660 138" fill="none" stroke="#10B981" stroke-width="2.5"/>

    <!-- Drop Marker Annotation -->
    <line x1="500" y1="30" x2="500" y2="150" stroke="#EF4444" stroke-dasharray="3 3" stroke-width="1.5"/>
    <rect x="440" y="10" width="120" height="22" rx="4" fill="#7F1D1D" stroke="#EF4444"/>
    <text x="500" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="10" fill="#FECACA" text-anchor="middle">QUEDA DE PRESSÃO (ΔP)</text>

    <!-- Legend -->
    <circle cx="60" cy="155" r="4" fill="#EF4444"/>
    <text x="72" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Pressão (PSI)</text>
    
    <circle cx="170" cy="155" r="4" fill="#10B981"/>
    <text x="182" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Vazão (m³/h)</text>
  </g>
</svg>
